---
# Dashboard — deploys Homepage with automatic Traefik IngressRoute discovery
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dashboard
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/dashboard
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
