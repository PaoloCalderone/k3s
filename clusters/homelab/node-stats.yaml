---
# Node Stats — deploys API + Dashboard for CPU/RAM of the k3s nodes
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-stats
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/node-stats
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  dependsOn:
    - name: dashboard
