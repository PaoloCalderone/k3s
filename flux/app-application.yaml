# ============================================================
# Flux Application — Deployment delle Applicazioni dal Repository GitHub
# ============================================================

apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: k3s-homelab-repo
  namespace: flux-system
spec:
  url: "https://github.com/TUO-USERNAME/k3s-talos-homelab.git"
  ref:
    branch: main
  interval: 1m0s

---

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k3s-applications
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./flux
  prune: true         # Elimina risorse non più nel git
  wait: true          # Aspetta che le risorse diventino ready
  retryInterval: 2m   # Quanto aspettare tra i retry
  timeout: 5m0s

  # Fonte: il repository Git
  sourceRef:
    kind: GitRepository
    name: k3s-homelab-repo

  # Namespace dove applicare le risorse
  namespace: flux-system
