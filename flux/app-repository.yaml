# ============================================================
# Flux GitRepository — puntamento al tuo repository GitHub
# ============================================================

apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: k3s-homelab
  namespace: flux-system
spec:
  # Il tuo repository GitHub (cambia con i tuoi dati)
  url: "https://github.com/TUO-USERNAME/k3s-talos-homelab.git"
  ref:
    branch: main

  # Interval di sincronizzazione (quanto spesso Flux controlla i cambiamenti)
  interval: 1m0s

  # Secret per l'accesso (se repository privato, crea un token GitHub e un Secret)
  # per repository pubblici, commenta i campi secretRef e secretRef Name
  #
  # Per un repo privato, crea prima il Secret:
  #   kubectl create secret generic flux-git-token \
  #     --from-literal=token='<github-personal-access-token>' \
  #     --namespace=flux-system
  #
  # secretRef:
  #   name: flux-git-token
