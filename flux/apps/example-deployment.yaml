# ============================================================
# Example Application — Deployment + Service + PVC (Storage)
# This file is deployed by Flux in the K3s cluster
# Uses NFS storage from TrueNAS (storage class: true-nas-nfs)
# =========================================

# --- Namespace ---
apiVersion: v1
kind: Namespace
metadata:
  name: example
  labels:
    app: example

---

# --- Deployment: 3 replicas of the container (on 3 workers) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: example
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27  # <<< CHANGE with the image of your app
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          # If you have a secret or configmap to mount:
          # volumeMounts:
          #   - name: config
          #     mountPath: /etc/nginx/conf.d
          # volumes:
          #   - name: config
          #     configMap:
          #       name: nginx-config
          # --- Persistent Volume Claim (optional — data on TrueNAS NFS) ---
          # volumeMounts:
          #   - name: data
          #     mountPath: /data
          # volumes:
          #   - name: data
          #     persistentVolumeClaim:
          #       claimName: nginx-data

---

# --- Service: Exposes the app with an external IP (MetalLB) ---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: example
  labels:
    app: nginx
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer  # <<< MetalLB will assign an IP from the pool

# To access the app, find the IP with:
#   kubectl get svc nginx -n example
# Then: curl http://<ASSIGNED-IP>

# --- Persistent Volume Claim (using NFS from TrueNAS) ---
# (Optional — if you need persistent storage)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-data
  namespace: example
spec:
  # Use the NFS storage class from TrueNAS
  storageClassName: true-nas-nfs  # <<< Storage Class defined in nfs-csi.yaml
  accessModes:
    - ReadWriteMany  # RWX — accessible from all pods
  resources:
    requests:
      storage: 10Gi  # <<< CHANGE with the space you need

# --- (Optional) Ingress — expose with a domain name ---
# Use Traefik or NGINX Ingress Controller to expose with a URL:
#   app.example.com → http://<nginx-service>:80
