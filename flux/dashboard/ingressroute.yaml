---
# Homepage IngressRoute — expose dashboard.unifi.localdomain
# Homepage si auto-riconosce e non si mostra come card del dashboard.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  namespace: flux-system
  annotations:
    # Homepage riconosce la propria rotta e la nasconde dalla lista delle card
    gethomepage.dev/enabled: "false"
spec:
  entryPoints:
    - websecure
  tls:
    secretName: unifi-localdomain-tls
  routes:
    - match: Host(`homepage.unifi.localdomain`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
