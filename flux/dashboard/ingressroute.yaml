---
# Homepage IngressRoute — expose dashboard.unifi.localdomain
# Homepage self-identifies and does not show itself as a dashboard card.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  namespace: flux-system
  annotations:
    # Homepage recognizes its own route and hides it from the card list
    gethomepage.dev/enabled: "false"
spec:
  entryPoints:
    - websecure
  tls:
    secretName: unifi-localdomain-tls
  routes:
    - match: Host(`homepage.unifi.localdomain`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
