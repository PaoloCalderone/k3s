---
# Homepage dashboard — kustomization for Flux
# Collects: HelmRelease, ConfigMap, IngressRoute, Test Service

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release.yaml
  - homepage-config.yaml
  - services-configmap.yaml
  - init-scripts-configmap.yaml
  - ingressroute.yaml
  - test-service.yaml
