---
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: flux-system
  labels:
    app: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage-ingressroute-reader
  labels:
    app: homepage
rules:
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-ingressroute-reader
  labels:
    app: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: flux-system
roleRef:
  kind: ClusterRole
  name: homepage-ingressroute-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: flux-system
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      initContainers:
        - name: init-config
          image: ghcr.io/gethomepage/homepage:v2.4.0
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /app/config
              cp /app/config-template/settings.yaml /app/config/
              cp /app/services-template/services.yaml /app/config/
              if [ -f /app/secrets/grafana-apikey ]; then
                echo "Injecting Grafana API key"
                node /app/init-scripts/inject-apikey.js
              else
                echo "No API key secret found, skipping injection"
              fi
          env:
            - name: GRAFANA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: grafana-apikey
          volumeMounts:
            - name: config-template
              mountPath: /app/config-template
              readOnly: true
            - name: services-template
              mountPath: /app/services-template
              readOnly: true
            - name: grafana-apikey
              mountPath: /app/secrets
              readOnly: true
            - name: init-scripts
              mountPath: /app/init-scripts
              readOnly: true
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.4.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: LOG_LEVEL
              value: "warn"
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.unifi.localdomain"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: config-template
          configMap:
            name: homepage-config
        - name: services-template
          configMap:
            name: homepage-services
            items:
              - key: services.yaml
                path: services.yaml
        - name: grafana-apikey
          secret:
            secretName: homepage-secrets
            items:
              - key: grafana-apikey
                path: grafana-apikey
        - name: init-scripts
          configMap:
            name: homepage-init-scripts
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: flux-system
  labels:
    app: homepage
spec:
  selector:
    app: homepage
  ports:
    - port: 3000
      targetPort: 3000
      name: http
