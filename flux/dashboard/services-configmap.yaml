---
# Separate ConfigMap for Homepage v2 — services.yaml
# Homepage v2.4.0 - services reachable from the browser via Traefik
#
# NOTE: Grafana API key is in a Kubernetes Secret (homepage-secrets)
# and is injected via initContainer into /app/config/services.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-services
  namespace: flux-system
data:
  services.yaml: |
    - Monitoring:
        - Grafana:
            url: "https://grafana.unifi.localdomain"
            description: "Dashboards and visualizations"
            icon: "grafana"
            widget:
              type: "grafana"
              url: "https://grafana.unifi.localdomain"
        - Prometheus:
            url: "https://prometheus.unifi.localdomain"
            description: "Metrics and monitoring"
            icon: "prometheus"
            widget:
              type: "prometheus"
              url: "https://prometheus.unifi.localdomain"
        - Alertmanager:
            url: "https://alertmanager.unifi.localdomain"
            description: "Notifications and alerts"
            icon: "alert"
    - Infrastructure:
        - Traefik:
            url: "https://traefik.unifi.localdomain"
            description: "Ingress controller"
            icon: "shield"
            widget:
              type: "traefik"
              url: "https://traefik.unifi.localdomain"
    - Cluster:
        - Node Stats:
            url: "https://node-stats.unifi.localdomain"
            description: "K3s node statistics"
            icon: "server"
            widget:
              type: "iframe"
              url: "https://node-stats.unifi.localdomain"
