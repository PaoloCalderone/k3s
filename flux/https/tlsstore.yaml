---
# Traefik TLSStore — uses unifi.localdomain as the default certificate
# The secret unifi-localdomain-tls MUST exist in the kube-system namespace (where Traefik runs).
# Copy the secret from flux-system to kube-system:
#   kubectl -n flux-system get secret unifi-localdomain-tls -o yaml | sed 's/namespace: flux-system/namespace: kube-system/' | kubectl apply -f -

apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: unifi-localdomain-tls
