---
# Traefik TLSStore — usa unifi.localdomain come certificato di default
# Il secret unifi-localdomain-tls DEVE esistere nel namespace kube-system (dove gira Traefik).
# Copia il secret da flux-system a kube-system:
#   kubectl -n flux-system get secret unifi-localdomain-tls -o yaml | sed 's/namespace: flux-system/namespace: kube-system/' | kubectl apply -f -

apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: unifi-localdomain-tls
