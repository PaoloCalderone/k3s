# ============================================================
# Longhorn — Storage Persistente per il Cluster K3s
# ============================================================

# Longhorn è un CSI (Container Storage Interface) built on top di Kubernetes
# che permette di creare PV (Persistent Volumes) distribuiti sui nodi del cluster.
# Supporta sia RWO (ReadWriteOnce) che RWX (ReadWriteMany).

apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: longhorn
  namespace: flux-system
spec:
  type: oci
  url: oci://longhorn-unofficial.stakater.com/longhorn/longhorn-charts
  interval: 1h0m0s

---

apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 30m0s
  chartRef:
    name: longhorn
    kind: HelmRepository

  # Per un cluster con 3+ nodi, Longhorn funziona benissimo
  # Usa uno storage diverso da quello del sistema (es. un secondo disco)
  values:
    # Disabilita l'UI di Longhorn (opzionale, utile per debug)
    persistence:
      # Each node gets a local disk (or use LVM cache)
      fsGroup: "1000"

    # Replica automatica (3 copie su 3 nodi = resilienza)
    replicaSoftAntiAffinity: false
    replicaAutoBalance: "recommend"
    upfrontLocking: "auto"

    # Caching: se hai SSD/NVMe come disco secondario su ogni nodo, usa quello
    #Es. storage:
    #  - name: default-local-path
    #    storageClass:
    #      defaultClass: true
    #      reclaimPolicy: Retain
    #      volumeBindingMode: WaitForFirstConsumer
    #      allowedTopologies:
    #        - matchExpressions:
    #            - key: kubernetes.io/hostname
    #              operator: In
    #              values:
    #                - k8s-cp-1
    #                - k8s-w1
    #                - k8s-w2

    # System settings
    resources: {}
    admissionWebhooks:
      failurePolicy: Ignore
