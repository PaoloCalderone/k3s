---
# Grafana IngressRoute — exposed at grafana.unifi.localdomain
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Grafana"
    gethomepage.dev/description: "Dashboard e visualizzazioni"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/icon: "grafana"
    gethomepage.dev/widget.type: "grafana"
spec:
  entryPoints:
    - websecure
  tls:
    secretName: unifi-localdomain-tls
  routes:
    - match: Host(`grafana.unifi.localdomain`)
      kind: Rule
      services:
        - name: monitoring-monitoring-grafana
          port: 3000

---
# Prometheus IngressRoute — exposed at prometheus.unifi.localdomain
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Prometheus"
    gethomepage.dev/description: "Metrics and monitoring"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/icon: "prometheus"
    gethomepage.dev/widget.type: "prometheus"
spec:
  entryPoints:
    - websecure
  tls:
    secretName: unifi-localdomain-tls
  routes:
    - match: Host(`prometheus.unifi.localdomain`)
      kind: Rule
      services:
        - name: monitoring-monitoring-kube-prometheus
          port: 9090

---
