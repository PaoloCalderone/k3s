# monitoring stack: HelmRepository + HelmRelease for kube-prometheus-stack
# deploys: Prometheus, Grafana, Alertmanager, kube-state-metrics, node-exporter

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts

---
# Core monitoring: Prometheus + Alertmanager + Grafana + node-exporter
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: monitoring
  install:
    createNamespace: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "73.2.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  values:
    # ---- prometheus-operator ----
    prometheusOperator:
      createCRD: true

    # ---- Prometheus (metrics storage + scraping) ----
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilHandling: null
        serviceMonitorNamespaceSelectorNilHandling: null
        podMonitorSelectorNilHandling: null
        podMonitorNamespaceSelectorNilHandling: null
        retention: 14d
        retentionSize: 10GB
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        storageSpec:
          volumeClaimSpecification:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "nfs-csi"
            resources:
              requests:
                storage: 10Gi
        serviceMonitor:
          selector: {}
          namespaceSelector:
            matchAny: true
          route: {}
          path: /metrics

    # ---- Grafana (UI + dashboards) ----
    grafana:
      enabled: true
      adminPassword: homelab
      persistence:
        enabled: true
        type: pvc
        storageClassName: "nfs-csi"
        accessModes: ["ReadWriteMany"]
        size: 5Gi
      service:
        type: LoadBalancer
        loadBalancerIP: "192.168.9.210"
        port: 3000
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 512Mi
      # Skip the init-chown-data container which fails on NFS (root_squash)
      # Grafana container runs as UID 472 by default; fsGroup ensures mount has correct group
      initChownData: false
      # Pre-load dashboards
      dashboardproviders:
        dashboardproviders.yaml:
          apiVersion: v1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDelete: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          kubernetes:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/k8s.json
            datasource: Prometheus
          nodes:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/nodes.json
            datasource: Prometheus
          pod:
            url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/pod.json
            datasource: Prometheus
      sidecar:
        resources: {}

    # ---- kube-state-metrics (pod/node state) ----
    kube-state-metrics:
      enabled: true

    # ---- node-exporter (per-node metrics) ----
    nodeExporter:
      enabled: true

    # ---- Alertmanager (alert routing) ----
    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimSpecification:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "nfs-csi"
            resources:
              requests:
                storage: 2Gi
