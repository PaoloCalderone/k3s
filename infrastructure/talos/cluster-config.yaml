# ============================================================
# Cluster Config per Talos + K3s su Proxmox — 3 CP + 3 Worker (HA)
# Mappatura nodi:
#   pve1 → k8s-cp-1 (CP, 192.168.9.10) + k8s-w1 (Worker, 192.168.9.10)
#   pve2 → k8s-cp-2 (CP, 192.168.9.11) + k8s-w2 (Worker, 192.168.9.20)
#   pve3 → k8s-cp-3 (CP, 192.168.9.12) + k8s-w3 (Worker, 192.168.9.30)
#   LB → haproxy-lb (VIP: 192.168.9.8)
#   NAS → truenas (192.168.9.50)
# Network: 192.168.9.0/24 (VLAN dedicata)
# Generato da: talosctl gen cluster k3s-homelab
# =========================================

cluster:
  # ID del cluster (generato da talosctl gen cluster)
  # Genera con: talosctl gen cluster k3s-homelab --output <directory>
  id: <CLUSTER-ID-DA-GENERARE-con-talosctl-gen-cluster>
  secret: [REDACTED:API key param]

  # Nome del cluster (usato per la net-config di Talos)
  name: k3s-homelab

  # Endpoint del control plane (il VIP del Load Balancer — NON un singolo nodo!)
  # Questo IP è gestito da HAProxy e bilancia tra i 3 nodi Control Plane
  controlPlaneEndpoint: "192.168.9.8:6443"  # HA VIP (HAProxy/kube-vip)

  # === Network ===
  network:
    dnsDomain: "cluster.local"
    podSubnets:
      - "10.244.0.0/16"
    serviceSubnets:
      - "10.96.0.0/12"

  # === K3s Specific ===
  # Abilita/disabilita addon, versione, token
  k3s:
    version: "v1.32.2"  # <<< CAMBIA
    token: "k3s-homelab-token-CHANGE-ME"  # <<< GENERA E CAMBIA!

    # Addon da disabilitare (Traefik + ServiceLB — usiamo Flux + MetalLB)
    disable:
      - traefik
      - servicelb

  # === etcd — Cluster HA (3 nodi) ===
  # I 3 nodi CP formano un cluster etcd per alta disponibilità del datastore
  # Ogni nodo deve conoscere gli altri 2 CP
  # (configurato nelle machine configs individuali con additionalEtcdHosts)

  # === Storage ===
  # Note: questo cluster usa NFS dal TrueNAS (montato come storage class)
  # Non usa Longhorn (che replica dati su dischi locali).
  # Il backup è gestito da Proxmox Backup Server (PBS) a livello hypervisor.

# Extensions (opzionale)
extensions:
  kernelModules: []
  deviceNodes: []
