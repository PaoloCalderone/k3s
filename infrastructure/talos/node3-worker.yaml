# ============================================================
# Machine Config — NODO Worker 2 (192.168.9.22)
# Mappatura: pve2 → k8s-w2 (Worker)
# Network: 192.168.9.0/24 (VLAN dedicata)
# =========================================

type: config

# ============================================================
# Network
# ============================================================
network:
  hostname: k8s-w2

  interfaces:
    - interface: eth0  # <<< CAMBIA se la tua interfaccia è diversa
      addresses:
        - "192.168.9.22/24"  # IP Worker 2
      routes:
        - network: "0.0.0.0/0"
          gateway: "192.168.9.1"  # Gateway del cluster
      nameservers:
        - "192.168.9.1"  # DNS del cluster

  # Hosts — mappatura nomi IP per tutti i nodi del cluster
  hosts:
    - ip: "192.168.9.99"
      domains: ["haproxy-lb"]
    - ip: "192.168.9.11"
      domains: ["k8s-cp1"]
    - ip: "192.168.9.21"
      domains: ["k8s-cp2"]
    - ip: "192.168.9.31"
      domains: ["k8s-cp3"]
    - ip: "192.168.9.12"
      domains: ["k8s-w1"]
    - ip: "192.168.9.22"
      domains: ["k8s-w2"]
    - ip: "192.168.9.32"
      domains: ["k8s-w3"]
    - ip: "192.168.9.9"  # IP del TrueNAS
      domains: ["truenas"]

# ============================================================
# Cluster
# ============================================================
cluster:
  name: k3s-homelab

  # Il control plane endpoint DEVE essere il VIP del Load Balancer (NON un singolo nodo!)
  controlPlaneEndpoint: "192.168.9.99:6443"  # HA VIP (HAProxy/kube-vip)

  nodeIP: "192.168.9.22"

  # === K3s Configuration ===
  k3s:
    version: "v1.32.2"  # <<< CAMBIA

    # Stesso token del CP!
    token: "k3s-homelab-token-CHANGE-ME"  # <<< GENERA E CAMBIA!

    disable:
      - traefik
      - servicelb

    dataDir: "/var/lib/rancher/k3s"

    extraArgs:
      - "--node-ip=192.168.9.22"
      - "--cluster-cidr=10.244.0.0/16"
      - "--service-cidr=10.96.0.0/12"
      - "--cluster-dns=10.96.0.10"

# ============================================================
# Machines
# ============================================================
machines:
  - "k8s-w2"

# ============================================================
# Locale (opzionale)
# ============================================================
locale:
  timezone: "Europe/Rome"  # <<< CAMBIA
  keyboard: "it"           # <<< CAMBIA
